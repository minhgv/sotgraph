name: Claims Lint

# SG-110: the main CI workflow paths-ignores **.md and docs/**, so docs-only
# PRs run no validation at all. Trust claims (metrics, guarantees, ceilings)
# must be validated against the claim registry and its artifact traces at the
# exact commit that carries them — including docs-only changes. This workflow
# deliberately does NOT ignore Markdown paths.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SG-303: lint-only job needs no token grants beyond reading the repo.
permissions:
  contents: read

jobs:
  claims:
    name: Trust-claim registry lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Registry provenance checks verify that cited commits are
          # ancestors of HEAD; shallow clones cannot answer that.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint trust claims (registry + docs corpus)
        run: uv run sotgraph claims lint

      - name: Claims linter test suite
        run: uv run pytest tests/test_sg110_claims.py -q
