name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
      - "plan/**"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - "**.md"
      - "plan/**"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SG-303: least-privilege default for all jobs; the release and publish-pypi
# jobs escalate below via their own job-level permissions blocks.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check syntax & compile
        run: uv run python -m compileall src/ tests/

  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite (pytest)
        run: uv run pytest tests/ -v --strict-markers

  accuracy-oracle:
    name: Accuracy Oracle (P0 exact 6-tuple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Oracle self-check (discrimination proofs)
        run: uv run python scripts/sot_evaluator.py --selfcheck

      - name: Full corpus run (metric gate + baseline regeneration)
        run: uv run python scripts/sot_evaluator.py --gate --output /tmp/builtin-baseline-ci.json

      - name: Committed baseline matches fresh corpus digest
        run: |
          uv run python - <<'EOF'
          import json
          committed = json.load(open("benchmarks/oracle/builtin-baseline.json"))
          fresh = json.load(open("/tmp/builtin-baseline-ci.json"))
          assert committed["corpus"]["digest"] == fresh["corpus"]["digest"], (
              "corpus changed without re-committing benchmarks/oracle/builtin-baseline.json"
          )
          print("corpus digest stable:", fresh["corpus"]["digest"][:16])
          EOF

      - name: Search quality gates (Hit@k/MRR)
        run: uv run python scripts/bench_search_quality.py --gate

      - name: Diff-impact oracle gates (P/R/F1)
        run: uv run python scripts/bench_diff_impact.py --gate

      - name: Upload baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builtin-baseline-${{ github.sha }}
          path: /tmp/builtin-baseline-ci.json
          retention-days: 30

  quality-gates:
    name: Quality Gates (P9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install audit tools
        run: uv tool install bandit && uv tool install pip-audit

      - name: Run quality gates
        run: bash scripts/quality_gates.sh

  module-eval:
    name: Module Eval (ruff + pyright + strict probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Adapter docs consistency (build_parser + MCP registry)
        run: uv run python scripts/adapter_docs_check.py

      - name: Module-scope evaluation (per-scope ruff/pyright/pytest + bug probes, strict)
        run: uv run python scripts/module_eval.py --strict-probes

      - name: Upload module-scope report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: module-scope-report-${{ github.sha }}
          path: evaluation/module_scope/
          retention-days: 30

  real-cbm-e2e:
    name: Real Provider E2E (Linux, CBM 0.10.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install real codebase-memory-mcp 0.10.8
        run: uv pip install codebase-memory-mcp==0.10.8

      - name: Run Real Provider E2E Validation Script
        run: |
          uv run python scripts/e2e_real_cbm.py
  package-smoke:
    name: Package & Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test wheel installation and CLI version
        run: |
          uv run python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); sys.exit(1) if not wheels else subprocess.run(['uv', 'run', '--isolated', '--with', wheels[0], 'sot', '--version'], check=True)"

      - name: Smoke test sdist installation and CLI version
        run: |
          uv run python -c "import glob, subprocess, sys; sdists = glob.glob('dist/*.tar.gz'); sys.exit(1) if not sdists else subprocess.run(['uv', 'run', '--isolated', '--with', sdists[0], 'sot', '--version'], check=True)"

      - name: Smoke test MCP server initialization
        run: uv run python scripts/ci_smoke.py mcp

      - name: Smoke test template and adapter generation
        run: uv run python scripts/ci_smoke.py template

  release:
    name: Publish Release Artifacts
    needs: [lint, test, accuracy-oracle, quality-gates, module-eval, real-cbm-e2e, package-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.10"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
