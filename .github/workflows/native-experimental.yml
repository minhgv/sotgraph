name: Native experimental build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engines/codebase-memory-mcp/**'
      - 'scripts/verify_native_source.py'
      - 'plan/python-c-monorepo/evidence/source-import-manifest.json'
      - '.github/workflows/native-experimental.yml'
permissions:
  contents: read
jobs:
  darwin-arm64-experimental:
    # This lane is a build check, NOT a supported-platform certification.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.NATIVE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact pinned source
        run: python3 scripts/verify_native_source.py
      - name: Build in scratch without installer or UI hooks
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/home" "$scratch/cache" "$scratch/tmp"
          cp -R engines/codebase-memory-mcp "$scratch/source"
          export HOME="$scratch/home" XDG_CACHE_HOME="$scratch/cache" TMPDIR="$scratch/tmp"
          make -C "$scratch/source" -f Makefile.cbm -j2 cbm
          shasum -a 256 "$scratch/source/build/c/codebase-memory-mcp"
      - name: Verify source remained unchanged
        run: python3 scripts/verify_native_source.py
